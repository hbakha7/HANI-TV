name: Build HANI TV Release APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hani-tv-release.jks"
          test -s "$RUNNER_TEMP/hani-tv-release.jks"

      - name: Build Release APK
        uses: eskatos/gradle-command-action@v3
        with:
          gradle-version: 8.7
          arguments: assembleRelease

      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$SDK/build-tools" -type f -name zipalign | sort -V | tail -n 1)"

          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          "$ZIPALIGN" -f 4 "$APK" "$RUNNER_TEMP/hani-tv-aligned.apk"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/hani-tv-release.jks" \
            --ks-type JKS \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            "$RUNNER_TEMP/hani-tv-aligned.apk"

          "$APKSIGNER" verify --verbose \
            app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: HANI-TV-Release-Signed
          path: app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/hani-tv-release.jks"
          rm -f "$RUNNER_TEMP/hani-tv-aligned.apk"
